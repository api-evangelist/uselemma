                          - string
                          - 'null'
                          format: date-time
                        first_seen_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        last_seen_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        occurrence_count:
                          type: number
                        trace_count:
                          type: number

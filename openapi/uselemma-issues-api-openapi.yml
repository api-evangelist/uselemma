  /issues/{issue_id}:
    get:
      operationId: get_issue
      tags:
      - Issues
      summary: Get issue
      description: Get a single issue. The validation field is null when no validation row exists; when present it contains status, confidence, evidenceSummary, checkedTools, caveats, and validatedAt.
      parameters:
      - name: issue_id
        in: path
        required: true
        description: Issue ID.
        schema:
          type: string
      responses:
        '200':
          description: Issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  project_id:
                    type: string
                  agent_name:
                    type:
                    - string
                    - 'null'
                  name:
                    type: string
                  subsystem:
                    type:
                    - string
                    - 'null'
                  failure_class:
                    type:
                    - string
                    - 'null'

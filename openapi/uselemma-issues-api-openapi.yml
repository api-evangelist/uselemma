    patch:
      operationId: set_issue_status
      tags:
      - Issues
      summary: Set issue status
      description: Update issue lifecycle status. Resolved and dismissed close the issue and append close feedback.
      parameters:
      - name: issue_id
        in: path
        required: true
        description: Issue ID.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - open
                  - resolved
                  - dismissed
                reason:
                  type: string
                  enum:
                  - False positive
                  - Working as intended
                  - Test or synthetic traffic
                  - Acceptable edge case
                  - Known limitation
                  - Out of scope
                  description: 'Accepted values: False positive, Working as intended, Test or synthetic traffic, Acceptable edge case, Known limitation, Out of scope'
                detail:
                  type: string
              additionalProperties: false
      responses:
        '204':
          description: Issue status updated
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                - detail
                additionalProperties: false
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                - detail
                additionalProperties: false
  /issues/{issue_id}/metric-series:
    get:
      operationId: get_issue_metric_series
      tags:
      - Issues
      summary: Get issue metric series
      description: Returns zero-filled daily occurrence buckets for an issue over the last 30 days.
      parameters:
      - name: issue_id
        in: path
        required: true
        description: Issue ID.
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        description: Project ID.
        schema:
          type: string
      - name: as_of
        in: query
        required: false
        description: As-of timestamp (ISO-8601) for the 30-day window.
        schema:
          type: string
      responses:
        '200':
          description: Issue metric series
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue_id:
                    type: string
                  project_id:
                    type: string
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        occurrences:
                          type: number
                        estimated_occurrences:
                          type: number
                        estimated_occurrences_variance:
                          type: number
                        occurred:
                          type: boolean
                      required:
                      - date
                      - occurrences
                      - estimated_occurrences
                      - estimated_occurrences_variance
                      - occurred
                      additionalProperties: false
                  baseline_mean:
                    type: number
                  band_low:
                    type: number
                  band_high:
                    type: number
                  estimated_baseline_mean:
                    type: number
                  estimated_band_high:
                    type: number
                required:
                - issue_id
                - project_id
                - points
                - baseline_mean
                - band_low
                - band_high
                - estimated_baseline_mean
                - estimated_band_high
                additionalProperties: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                - detail
                additionalProperties: false
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                - detail
                additionalProperties: false

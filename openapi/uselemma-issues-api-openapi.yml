                            spike:
                              type:
                              - boolean
                              - 'null'
                            persistence:
                              type:
                              - boolean
                              - 'null'
                          required:
                          - impact
                          - spike
                          - persistence
                          additionalProperties: false
                        fired_count:
                          type:
                          - number
                          - 'null'
                        surface:
                          type:
                          - boolean
                          - 'null'

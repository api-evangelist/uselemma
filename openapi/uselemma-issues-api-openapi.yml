      parameters:
      - name: project_id
        in: query
        required: true
        description: Project ID.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Issue status filter.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum number of records to return.
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        required: false
        description: Number of records to skip.
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Issues list
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        project_id:
                          type: string
                        agent_name:
                          type:

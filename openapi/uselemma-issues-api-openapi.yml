                        enum:
                        - resolved
                        - dismissed
                      reason:
                        type:
                        - string
                        - 'null'
                      detail:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type:
                        - string
                        - 'null'
                        format: date-time

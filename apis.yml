aid: uselemma
name: Lemma
description: >-
  Lemma (uselemma.ai, Forge AI Labs, Inc., Y Combinator Fall 2025) is a
  production monitoring and observability platform for AI agents. Teams
  instrument agents with the Lemma tracing SDKs (TypeScript and Python) so
  every agent execution becomes one trace with LLM generations, tool calls,
  and app-logic spans as children; Lemma then surfaces silent semantic
  failures, groups recurring issues with root-cause analysis, sends signed
  incident webhooks, and exposes the whole surface — projects, traces, issues,
  and learn-agent artifacts — through the Lemma Platform API and an official
  remote MCP server so coding agents can pull the exact runs and errors they
  need and fix issues in place.
